<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Product - JumpSale</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

</head>


<body>


<div class="container py-5">


    <!-- =====================================
         BACK TO DASHBOARD
    ====================================== -->

    <div class="mb-4">

        <a
            href="admin-dashboard.html"
            class="btn btn-dark"
        >

            <i class="bi bi-arrow-left"></i>

            Back to Dashboard

        </a>

    </div>


    <!-- =====================================
         ADD / UPDATE PRODUCT FORM
    ====================================== -->

    <div class="card shadow mb-5">

        <div class="card-header bg-warning">

            <h3
                class="mb-0"
                id="formTitle"
            >
                Add Product
            </h3>

        </div>


        <div class="card-body">


            <form id="productForm">


                <!-- PRODUCT NAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Product Name *
                    </label>

                    <input
                        type="text"
                        id="productName"
                        class="form-control"
                        required
                    >

                </div>


                <!-- PRICE -->

                <div class="mb-3">

                    <label class="form-label">
                        Price *
                    </label>

                    <input
                        type="number"
                        id="price"
                        class="form-control"
                        min="0"
                        required
                    >

                </div>


                <!-- OLD PRICE -->

                <div class="mb-3">

                    <label class="form-label">
                        Old Price
                    </label>

                    <input
                        type="number"
                        id="oldPrice"
                        class="form-control"
                        min="0"
                    >

                </div>


                <!-- DISCOUNT -->

                <div class="mb-3">

                    <label class="form-label">
                        Discount
                    </label>

                    <input
                        type="text"
                        id="discount"
                        class="form-control"
                        placeholder="Example: 20% OFF"
                    >

                </div>


                <!-- STOCK -->

                <div class="mb-3">

                    <label class="form-label">
                        Stock *
                    </label>

                    <input
                        type="number"
                        id="stock"
                        class="form-control"
                        min="0"
                        required
                    >

                </div>


                <!-- BRAND -->

                <div class="mb-3">

                    <label class="form-label">
                        Brand *
                    </label>

                    <input
                        type="text"
                        id="brand"
                        class="form-control"
                        placeholder="Example: Samsung"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="mb-3">

                    <label class="form-label">
                        Category *
                    </label>

                    <input
                        type="text"
                        id="category"
                        class="form-control"
                        placeholder="Example: Smartphone"
                        required
                    >

                </div>


                <!-- COLOR -->

                <div class="mb-3">

                    <label class="form-label">
                        Color
                    </label>

                    <input
                        type="text"
                        id="color"
                        class="form-control"
                        placeholder="Example: Black"
                    >

                </div>


                <!-- CONNECTIVITY -->

                <div class="mb-3">

                    <label class="form-label">
                        Connectivity
                    </label>

                    <input
                        type="text"
                        id="connectivity"
                        class="form-control"
                        placeholder="Example: 5G, Wi-Fi, Bluetooth"
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="mb-3">

                    <label class="form-label">
                        Description *
                    </label>

                    <textarea
                        id="description"
                        class="form-control"
                        rows="5"
                        required
                    ></textarea>

                </div>


                <hr>


                <!-- IMAGES -->

                <h5 class="mb-3">
                    Product Images
                </h5>


                <!-- IMAGE 1 -->

                <div class="mb-3">

                    <label class="form-label">
                        Product Image 1 *
                    </label>

                    <input
                        type="file"
                        id="image1"
                        class="form-control"
                        accept="image/*"
                    >

                    <small
                        class="text-muted"
                        id="image1Help"
                    >
                        Image 1 is required for new product.
                    </small>

                </div>


                <!-- IMAGE 2 -->

                <div class="mb-3">

                    <label class="form-label">
                        Product Image 2
                    </label>

                    <input
                        type="file"
                        id="image2"
                        class="form-control"
                        accept="image/*"
                    >

                </div>


                <!-- IMAGE 3 -->

                <div class="mb-3">

                    <label class="form-label">
                        Product Image 3
                    </label>

                    <input
                        type="file"
                        id="image3"
                        class="form-control"
                        accept="image/*"
                    >

                </div>


                <!-- IMAGE 4 -->

                <div class="mb-3">

                    <label class="form-label">
                        Product Image 4
                    </label>

                    <input
                        type="file"
                        id="image4"
                        class="form-control"
                        accept="image/*"
                    >

                </div>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="mb-3"
                ></div>


                <!-- SAVE BUTTON -->

                <button
                    type="submit"
                    id="saveButton"
                    class="btn btn-warning"
                >

                    <i class="bi bi-save"></i>

                    Add Product

                </button>


                <!-- CANCEL EDIT -->

                <button
                    type="button"
                    id="cancelButton"
                    class="btn btn-secondary d-none"
                >

                    <i class="bi bi-x-circle"></i>

                    Cancel Edit

                </button>


            </form>


        </div>

    </div>



    <!-- =====================================
         PRODUCT LIST
    ====================================== -->

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h4 class="mb-0">
                All Products
            </h4>

        </div>


        <div class="card-body">

            <div
                id="productList"
                class="row"
            ></div>

        </div>

    </div>


</div>


<script src="admin-products.js"></script>


</body>

</html>
