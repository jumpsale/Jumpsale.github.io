<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>JumpSale Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            font-family: Arial, sans-serif;
        }


        /* =========================
           NAVBAR
        ========================= */

        .admin-navbar {

            background: #ffc107;

            padding: 14px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

        }


        .admin-navbar h4 {

            margin: 0;

            font-weight: 700;

        }


        .logout-btn {

            border: none;

            background: #212529;

            color: #fff;

            padding: 8px 16px;

            border-radius: 7px;

            cursor: pointer;

        }


        .logout-btn:hover {

            background: #000;

        }


        /* =========================
           DASHBOARD
        ========================= */

        .dashboard {

            max-width: 1250px;

            margin: auto;

            padding: 30px 20px;

        }


        .dashboard-title {

            margin-bottom: 25px;

        }


        .dashboard-title h1 {

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 5px;

        }


        .dashboard-title p {

            color: #777;

            margin: 0;

        }


        /* =========================
           ADMIN MANAGEMENT BUTTONS
        ========================= */

        .admin-management-buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 20px;

        }


        .admin-management-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 11px 18px;

            border-radius: 8px;

            text-decoration: none;

            font-weight: 600;

            font-size: 14px;

            transition: 0.25s;

        }


        .inventory-btn {

            background: #212529;

            color: #fff;

        }


        .inventory-btn:hover {

            background: #000;

            color: #fff;

            transform: translateY(-2px);

        }


        .products-btn {

            background: #ffc107;

            color: #000;

        }


        .products-btn:hover {

            background: #e0a800;

            color: #000;

            transform: translateY(-2px);

        }


        /* =========================
           STAT CARDS
        ========================= */

        .stat-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

        }


        .stat-card {

            background: #fff;

            padding: 23px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);

        }


        .stat-icon {

            width: 45px;

            height: 45px;

            background: #fff3cd;

            color: #856404;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            margin-bottom: 15px;

        }


        .stat-card h6 {

            color: #777;

            margin-bottom: 8px;

        }


        .stat-card h2 {

            margin: 0;

            font-size: 28px;

            font-weight: 700;

        }


        /* =========================
           STATUS COLORS
        ========================= */

        .pending-icon {

            background: #fff3cd;

            color: #856404;

        }


        .confirmed-icon {

            background: #cff4fc;

            color: #055160;

        }


        .shipped-icon {

            background: #cfe2ff;

            color: #084298;

        }


        .delivered-icon {

            background: #d1e7dd;

            color: #0f5132;

        }


        .cancelled-icon {

            background: #f8d7da;

            color: #842029;

        }


        /* =========================
           ORDERS CARD
        ========================= */

        .orders-card {

            background: #fff;

            margin-top: 30px;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.06);

        }


        .orders-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;

        }


        .orders-header h3 {

            margin: 0;

            font-size: 22px;

            font-weight: 700;

        }


        /* =========================
           ORDER ACTIONS
        ========================= */

        .order-actions {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom: 20px;

        }


        .order-action-left {

            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

        }


        .delete-selected-btn {

            background: #dc3545;

            color: #fff;

            border: none;

            padding: 9px 14px;

            border-radius: 7px;

            font-weight: 600;

            cursor: pointer;

        }


        .delete-selected-btn:hover {

            background: #bb2d3b;

        }


        .delete-all-btn {

            background: #212529;

            color: #fff;

            border: none;

            padding: 9px 14px;

            border-radius: 7px;

            font-weight: 600;

            cursor: pointer;

        }


        .delete-all-btn:hover {

            background: #000;

        }


        .delete-selected-btn:disabled {

            opacity: .5;

            cursor: not-allowed;

        }


        /* =========================
           FILTER
        ========================= */

        #statusFilter {

            width: auto;

            min-width: 180px;

            height: 42px;

            border-radius: 7px;

            border: 1px solid #ddd;

        }


        #statusFilter:focus {

            border-color: #ffc107;

            box-shadow:
                0 0 0 .2rem
                rgba(255,193,7,.2);

        }


        /* =========================
           TABLE
        ========================= */

        .table-wrapper {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th,
        td {

            padding: 13px;

            border-bottom:
                1px solid #eee;

            text-align: left;

            white-space: nowrap;

        }


        th {

            background: #f8f9fa;

            font-size: 14px;

        }


        .select-column {

            width: 45px;

            text-align: center;

        }


        .order-checkbox {

            width: 17px;

            height: 17px;

            cursor: pointer;

        }


        /* =========================
           STATUS BADGE
        ========================= */

        .status-badge {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 600;

        }


        .status-pending {

            background: #fff3cd;

            color: #856404;

        }


        .status-confirmed {

            background: #cff4fc;

            color: #055160;

        }


        .status-shipped {

            background: #cfe2ff;

            color: #084298;

        }


        .status-delivered {

            background: #d1e7dd;

            color: #0f5132;

        }


        .status-cancelled {

            background: #f8d7da;

            color: #842029;

        }


        /* =========================
           VIEW BUTTON
        ========================= */

        .view-btn {

            display: inline-block;

            background: #ffc107;

            color: #000;

            border: none;

            padding: 7px 13px;

            border-radius: 6px;

            text-decoration: none;

            font-weight: 600;

        }


        .view-btn:hover {

            background: #e0a800;

            color: #000;

        }


        /* =========================
           EMPTY
        ========================= */

        .empty-orders {

            text-align: center;

            padding: 35px;

            color: #777;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .stat-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 600px) {

            .admin-navbar {

                padding: 12px 15px;

            }


            .admin-navbar h4 {

                font-size: 18px;

            }


            .dashboard {

                padding: 20px 15px;

            }


            .dashboard-title h1 {

                font-size: 24px;

            }


            .stat-grid {

                grid-template-columns: 1fr;

            }


            .orders-card {

                padding: 18px;

            }


            .orders-header {

                flex-direction: column;

                align-items: stretch;

            }


            #statusFilter {

                width: 100%;

            }


            .admin-management-buttons {

                flex-direction: column;

            }


            .admin-management-btn {

                width: 100%;

            }


            .order-actions {

                flex-direction: column;

                align-items: stretch;

            }


            .order-action-left {

                width: 100%;

            }


            .delete-selected-btn,
            .delete-all-btn {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="admin-navbar">

    <h4>

        <i class="bi bi-shield-lock"></i>

        JumpSale Admin

    </h4>


    <button
        class="logout-btn"
        onclick="logoutAdmin()">

        <i class="bi bi-box-arrow-right"></i>

        Logout

    </button>

</nav>



<!-- =========================
     DASHBOARD
========================= -->

<main class="dashboard">


    <div class="dashboard-title">

        <h1>
            Dashboard
        </h1>

        <p>
            Manage your JumpSale orders.
        </p>


        <!-- =========================
             ADMIN MANAGEMENT BUTTONS
        ========================= -->

        <div class="admin-management-buttons">


            <!-- INVENTORY -->

            <a
                href="admin-inventory.html"
                class="admin-management-btn inventory-btn">

                <i class="bi bi-box-seam"></i>

                Manage Inventory

            </a>


            <!-- PRODUCTS -->

            <a
                href="admin-products.html"
                class="admin-management-btn products-btn">

                <i class="bi bi-grid-3x3-gap"></i>

                Manage Products

            </a>

        </div>

    </div>



    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="stat-grid">


        <!-- TOTAL ORDERS -->

        <div class="stat-card">

            <div class="stat-icon">

                <i class="bi bi-box-seam"></i>

            </div>

            <h6>
                Total Orders
            </h6>

            <h2 id="totalOrders">
                0
            </h2>

        </div>


        <!-- TOTAL CUSTOMERS -->

        <div class="stat-card">

            <div class="stat-icon">

                <i class="bi bi-people"></i>

            </div>

            <h6>
                Total Customers
            </h6>

            <h2 id="totalCustomers">
                0
            </h2>

        </div>


        <!-- TOTAL SALES -->

        <div class="stat-card">

            <div class="stat-icon">

                <i class="bi bi-currency-rupee"></i>

            </div>

            <h6>
                Total Sales
            </h6>

            <h2 id="totalSales">
                ₹0
            </h2>

        </div>


        <!-- PENDING -->

        <div class="stat-card">

            <div class="stat-icon pending-icon">

                <i class="bi bi-hourglass-split"></i>

            </div>

            <h6>
                Pending
            </h6>

            <h2 id="pendingOrders">
                0
            </h2>

        </div>


        <!-- CONFIRMED -->

        <div class="stat-card">

            <div class="stat-icon confirmed-icon">

                <i class="bi bi-check-circle"></i>

            </div>

            <h6>
                Confirmed
            </h6>

            <h2 id="confirmedOrders">
                0
            </h2>

        </div>


        <!-- SHIPPED -->

        <div class="stat-card">

            <div class="stat-icon shipped-icon">

                <i class="bi bi-truck"></i>

            </div>

            <h6>
                Shipped
            </h6>

            <h2 id="shippedOrders">
                0
            </h2>

        </div>


        <!-- DELIVERED -->

        <div class="stat-card">

            <div class="stat-icon delivered-icon">

                <i class="bi bi-check2-all"></i>

            </div>

            <h6>
                Delivered
            </h6>

            <h2 id="deliveredOrders">
                0
            </h2>

        </div>


        <!-- CANCELLED -->

        <div class="stat-card">

            <div class="stat-icon cancelled-icon">

                <i class="bi bi-x-circle"></i>

            </div>

            <h6>
                Cancelled
            </h6>

            <h2 id="cancelledOrders">
                0
            </h2>

        </div>

    </div>



    <!-- =========================
         ORDERS
    ========================= -->

    <div class="orders-card">


        <div class="orders-header">

            <h3>
                Recent Orders
            </h3>


            <!-- FILTER -->

            <select
                id="statusFilter"
                class="form-select">

                <option value="All">
                    All Orders
                </option>

                <option value="Pending">
                    Pending
                </option>

                <option value="Confirmed">
                    Confirmed
                </option>

                <option value="Shipped">
                    Shipped
                </option>

                <option value="Delivered">
                    Delivered
                </option>

                <option value="Cancelled">
                    Cancelled
                </option>

            </select>

        </div>


        <!-- =========================
             DELETE ACTIONS
        ========================= -->

        <div class="order-actions">


            <div class="order-action-left">

                <!-- SELECT ALL -->

                <div class="form-check">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="selectAll">

                    <label
                        class="form-check-label"
                        for="selectAll">

                        Select All

                    </label>

                </div>


                <!-- DELETE SELECTED -->

                <button
                    type="button"
                    id="deleteSelectedBtn"
                    class="delete-selected-btn"
                    onclick="deleteSelectedOrders()"
                    disabled>

                    <i class="bi bi-trash"></i>

                    Delete Selected

                </button>

            </div>


            <!-- DELETE ALL -->

            <button
                type="button"
                class="delete-all-btn"
                onclick="deleteAllOrders()">

                <i class="bi bi-trash3"></i>

                Delete All Orders

            </button>

        </div>



        <div class="table-wrapper">

            <table>


                <thead>

                    <tr>

                        <th class="select-column">

                            <input
                                type="checkbox"
                                class="order-checkbox"
                                id="selectAllTable">

                        </th>

                        <th>
                            Order ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="ordersTable">

                </tbody>


            </table>

        </div>


    </div>


</main>



<script>


// ==================================================
// ADMIN SECURITY CHECK
// ==================================================

if (
    sessionStorage.getItem("jumpsaleAdmin")
    !== "true"
) {

    window.location.href =
        "admin-login.html";

}


// ==================================================
// GET ORDERS
// ==================================================

let orders =

    JSON.parse(
        localStorage.getItem("orders")
    ) || [];


// ==================================================
// ELEMENTS
// ==================================================

const ordersTable =
    document.getElementById(
        "ordersTable"
    );

const selectAll =
    document.getElementById(
        "selectAll"
    );

const selectAllTable =
    document.getElementById(
        "selectAllTable"
    );

const deleteSelectedBtn =
    document.getElementById(
        "deleteSelectedBtn"
    );


// ==================================================
// UPDATE DASHBOARD STATISTICS
// ==================================================

function updateStatistics() {


    // TOTAL ORDERS

    document
        .getElementById("totalOrders")
        .innerText =
        orders.length;


    // TOTAL CUSTOMERS

    const customers =
        new Set();


    orders.forEach(order => {

        if (
            order.customer &&
            order.customer.mobile
        ) {

            customers.add(
                order.customer.mobile
            );

        }

    });


    document
        .getElementById("totalCustomers")
        .innerText =
        customers.size;


    // TOTAL SALES

    let totalSales = 0;


    orders.forEach(order => {

        totalSales +=
            Number(order.total) || 0;

    });


    document
        .getElementById("totalSales")
        .innerText =
        "₹" +
        totalSales.toLocaleString("en-IN");


    // STATUS COUNTS

    let pending = 0;
    let confirmed = 0;
    let shipped = 0;
    let delivered = 0;
    let cancelled = 0;


    orders.forEach(order => {


        const status =
            order.status || "Pending";


        if (status === "Pending") {

            pending++;

        }

        else if (status === "Confirmed") {

            confirmed++;

        }

        else if (status === "Shipped") {

            shipped++;

        }

        else if (status === "Delivered") {

            delivered++;

        }

        else if (status === "Cancelled") {

            cancelled++;

        }

    });


    document
        .getElementById("pendingOrders")
        .innerText =
        pending;


    document
        .getElementById("confirmedOrders")
        .innerText =
        confirmed;


    document
        .getElementById("shippedOrders")
        .innerText =
        shipped;


    document
        .getElementById("deliveredOrders")
        .innerText =
        delivered;


    document
        .getElementById("cancelledOrders")
        .innerText =
        cancelled;

}


// ==================================================
// RENDER ORDERS
// ==================================================

function renderOrders(filter = "All") {


    ordersTable.innerHTML = "";


    let filteredOrders =
        orders.slice().reverse();


    // FILTER

    if (filter !== "All") {

        filteredOrders =
            filteredOrders.filter(
                order =>
                    (order.status || "Pending")
                    === filter
            );

    }


    // NO ORDERS

    if (filteredOrders.length === 0) {

        ordersTable.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty-orders">

                    <i
                        class="bi bi-inbox"
                        style="font-size:30px;">
                    </i>

                    <br>

                    No ${filter === "All"
                        ? ""
                        : filter.toLowerCase()
                    } orders found.

                </td>

            </tr>

        `;


        updateDeleteButtons();

        return;

    }


    // ORDERS

    filteredOrders.forEach(order => {


        const customer =
            order.customer || {};


        const orderId =
            order.orderId || "N/A";


        const customerName =
            customer.name || "N/A";


        const mobile =
            customer.mobile || "N/A";


        const amount =
            Number(order.total) || 0;


        const status =
            order.status || "Pending";


        const date =
            order.date || "N/A";


        const statusClass =
            "status-" +
            status.toLowerCase();


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td class="select-column">

                <input
                    type="checkbox"
                    class="order-checkbox order-select"
                    value="${escapeHTML(orderId)}">

            </td>


            <td>

                ${escapeHTML(orderId)}

            </td>


            <td>

                ${escapeHTML(customerName)}

            </td>


            <td>

                ${escapeHTML(mobile)}

            </td>


            <td>

                ₹${amount.toLocaleString("en-IN")}

            </td>


            <td>

                <span
                    class="status-badge
                           ${statusClass}">

                    ${escapeHTML(status)}

                </span>

            </td>


            <td>

                ${escapeHTML(date)}

            </td>


            <td>

                <a
                    href="admin-order.html?id=${encodeURIComponent(orderId)}"
                    class="view-btn">

                    <i class="bi bi-eye"></i>

                    View

                </a>

            </td>

        `;


        ordersTable.appendChild(row);

    });


    updateDeleteButtons();

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==================================================
// GET SELECTED ORDERS
// ==================================================

function getSelectedOrderIds() {

    const checkboxes =
        document.querySelectorAll(
            ".order-select:checked"
        );


    return Array.from(checkboxes)
        .map(checkbox => checkbox.value);

}


// ==================================================
// UPDATE DELETE BUTTONS
// ==================================================

function updateDeleteButtons() {

    const selectedIds =
        getSelectedOrderIds();


    const hasSelected =
        selectedIds.length > 0;


    deleteSelectedBtn.disabled =
        !hasSelected;


    const visibleCheckboxes =
        document.querySelectorAll(
            ".order-select"
        );


    const checkedVisibleCheckboxes =
        document.querySelectorAll(
            ".order-select:checked"
        );


    const allVisibleSelected =
        visibleCheckboxes.length > 0 &&
        visibleCheckboxes.length ===
        checkedVisibleCheckboxes.length;


    selectAll.checked =
        allVisibleSelected;


    selectAllTable.checked =
        allVisibleSelected;

}


// ==================================================
// SELECT ALL FUNCTION
// ==================================================

function toggleSelectAll(checked) {

    const checkboxes =
        document.querySelectorAll(
            ".order-select"
        );


    checkboxes.forEach(checkbox => {

        checkbox.checked =
            checked;

    });


    updateDeleteButtons();

}


// ==================================================
// SELECT ALL - TOP
// ==================================================

selectAll.addEventListener(
    "change",
    function() {

        toggleSelectAll(
            this.checked
        );

    }
);


// ==================================================
// SELECT ALL - TABLE HEADER
// ==================================================

selectAllTable.addEventListener(
    "change",
    function() {

        toggleSelectAll(
            this.checked
        );

    }
);


// ==================================================
// CHECKBOX CHANGE
// ==================================================

ordersTable.addEventListener(
    "change",
    function(event) {

        if (
            event.target.classList
                .contains("order-select")
        ) {

            updateDeleteButtons();

        }

    }
);


// ==================================================
// DELETE SELECTED ORDERS
// ==================================================

function deleteSelectedOrders() {


    const selectedIds =
        getSelectedOrderIds();


    if (
        selectedIds.length === 0
    ) {

        alert(
            "Please select at least one order."
        );

        return;

    }


    const confirmDelete =
        confirm(
            "Are you sure you want to delete " +
            selectedIds.length +
            " selected order(s)?"
        );


    if (!confirmDelete) {

        return;

    }


    orders =
        orders.filter(
            order =>
                !selectedIds.includes(
                    String(
                        order.orderId || ""
                    )
                )
        );


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    // Reset selection

    selectAll.checked = false;

    selectAllTable.checked = false;


    // Update everything

    updateStatistics();


    const currentFilter =
        document.getElementById(
            "statusFilter"
        ).value;


    renderOrders(
        currentFilter
    );


    alert(
        selectedIds.length +
        " order(s) deleted successfully."
    );

}


// ==================================================
// DELETE ALL ORDERS
// ==================================================

function deleteAllOrders() {


    if (
        orders.length === 0
    ) {

        alert(
            "There are no orders to delete."
        );

        return;

    }


    const confirmDelete =
        confirm(
            "WARNING!\n\n" +
            "This will permanently delete ALL " +
            orders.length +
            " orders from this browser.\n\n" +
            "Are you sure?"
        );


    if (!confirmDelete) {

        return;

    }


    orders = [];


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    // Reset selection

    selectAll.checked = false;

    selectAllTable.checked = false;


    // Update dashboard

    updateStatistics();


    renderOrders();


    alert(
        "All orders have been deleted."
    );

}


// ==================================================
// INITIAL RENDER
// ==================================================

updateStatistics();

renderOrders();


// ==================================================
// FILTER CHANGE
// ==================================================

document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        function() {

            renderOrders(
                this.value
            );

        }
    );


// ==================================================
// LOGOUT
// ==================================================

function logoutAdmin() {

    sessionStorage.removeItem(
        "jumpsaleAdmin"
    );


    window.location.href =
        "admin-login.html";

}

</script>
