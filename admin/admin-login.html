<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JumpSale Admin Login</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f6f8;

            font-family: Arial, sans-serif;

        }


        .admin-login-container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

        }


        .admin-login-card {

            background: #ffffff;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);

        }


        /* LOGO */

        .admin-logo {

            width: 65px;

            height: 65px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #ffc107;

            color: #000;

            border-radius: 15px;

            font-size: 22px;

            font-weight: bold;

        }


        .admin-login-card h2 {

            text-align: center;

            margin-bottom: 8px;

            font-weight: 700;

        }


        .admin-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        /* INPUT */

        .form-label {

            font-weight: 600;

        }


        .form-control {

            height: 48px;

            border-radius: 8px;

        }


        .form-control:focus {

            border-color: #ffc107;

            box-shadow:
                0 0 0 0.2rem rgba(255, 193, 7, 0.20);

        }


        /* PASSWORD */

        .password-box {

            position: relative;

        }


        .password-box input {

            padding-right: 45px;

        }


        .password-toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #777;

            cursor: pointer;

        }


        /* LOGIN BUTTON */

        .admin-login-btn {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 8px;

            background: #ffc107;

            color: #000;

            font-weight: 600;

            transition: 0.3s;

        }


        .admin-login-btn:hover {

            background: #e0a800;

        }


        /* ERROR */

        .login-error {

            display: none;

            margin-top: 15px;

            padding: 10px;

            background: #f8d7da;

            color: #842029;

            border-radius: 7px;

            text-align: center;

            font-size: 14px;

        }


        /* SECURITY TEXT */

        .security-text {

            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 13px;

        }


        .security-text i {

            color: #198754;

        }


        /* MOBILE */

        @media (max-width: 500px) {

            .admin-login-container {

                padding: 15px;

            }


            .admin-login-card {

                padding: 25px 20px;

            }

        }

    </style>

</head>


<body>


<div class="admin-login-container">


    <div class="admin-login-card">


        <!-- LOGO -->

        <div class="admin-logo">

            JS

        </div>


        <!-- TITLE -->

        <h2>

            Admin Login

        </h2>


        <p class="admin-subtitle">

            JumpSale Administration Panel

        </p>


        <!-- FORM -->

        <form id="adminLoginForm">


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="adminEmail"
                    class="form-label">

                    Admin Email

                </label>


                <input
                    type="email"
                    id="adminEmail"
                    class="form-control"
                    placeholder="Enter admin email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="adminPassword"
                    class="form-label">

                    Password

                </label>


                <div class="password-box">

                    <input
                        type="password"
                        id="adminPassword"
                        class="form-control"
                        placeholder="Enter admin password"
                        required>


                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="admin-login-btn">

                <i class="bi bi-shield-lock"></i>

                Login to Admin Panel

            </button>


            <!-- ERROR -->

            <div
                id="loginError"
                class="login-error">

                Invalid admin email or password.

            </div>


        </form>


        <!-- SECURITY -->

        <div class="security-text">

            <i class="bi bi-shield-check"></i>

            Protected Admin Area

        </div>


    </div>

</div>



<script>


// ======================================
// ADMIN LOGIN
// ======================================

// TEMPORARY LOGIN
// Real security backend mein lagayenge.

const ADMIN_EMAIL =
    "admin@jumpsale.in";


const ADMIN_PASSWORD =
    "Redmi 13c 5g";


// ======================================
// LOGIN FORM
// ======================================

document
.getElementById("adminLoginForm")
.addEventListener("submit", function(event) {


    event.preventDefault();


    const email =
        document
        .getElementById("adminEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("adminPassword")
        .value;


    const error =
        document
        .getElementById("loginError");


    if (
        email === ADMIN_EMAIL &&
        password === ADMIN_PASSWORD
    ) {


        // ADMIN LOGIN SESSION

        sessionStorage.setItem(
            "jumpsaleAdmin",
            "true"
        );


        // DASHBOARD

        window.location.href =
            "admin-dashboard.html";


    } else {


        error.style.display =
            "block";


    }

});


// ======================================
// SHOW / HIDE PASSWORD
// ======================================

document
.getElementById("togglePassword")
.addEventListener("click", function() {


    const password =
        document
        .getElementById("adminPassword");


    const icon =
        this.querySelector("i");


    if (
        password.type === "password"
    ) {


        password.type = "text";


        icon.className =
            "bi bi-eye-slash";


    } else {


        password.type = "password";


        icon.className =
            "bi bi-eye";


    }

});


</script>


</body>

</html>
